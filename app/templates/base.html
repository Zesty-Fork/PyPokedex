<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlaskPokemon - {% block title %} {% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('main.index') }}">
                <img src="{{ url_for('static', filename='icon/logo.svg') }}" alt="FlaskPokemon logo, back to home" class="logo">
                <ul>
                    <li><a href="{{ url_for('main.index') }}">Home</a></li>
                    <li><a href="{{ url_for('pokedex.index') }}">Pokedex</a></li>
                </ul>
            </a>
        </nav>
    </header>
    <hr>
    {% block content %}{% endblock %}
    <!--<script src="{{ url_for('static', filename='js/scripts.js') }}"></script>-->
</body>
</html>
